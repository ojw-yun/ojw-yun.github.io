function startNext(){const pool=selectedDeck();const due=pool.filter(isDue);const unseen=pool.filter(w=>!(p(w.id).seen));const weak=pool.filter(w=>(p(w.id).seen||0)&&!isDue(w)).sort((a,b)=>(p(a.id).streak||0)-(p(b.id).streak||0));const selection=[...due,...unseen,...weak];const unique=[...new Map(selection.map(w=>[w.id,w])).values()];state.study={ids:unique.slice(0,options.goal).map(w=>w.id),index:0,correct:0,wrong:0};state.flip=false}

function shuffled(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startQuiz(){let pool=selectedDeck();if(pool.length<4){toast('这个词库至少需要 4 个单词才能做选择题');return}const learned=pool.filter(w=>p(w.id).seen);const rest=pool.filter(w=>!p(w.id).seen);const cards=shuffled(learned).concat(shuffled(rest)).slice(0,Math.min(state.quizCount,pool.length));state.quiz={ids:cards.map(w=>w.id),index:0,correct:0,answered:false,chosen:null,typed:'',items:[],missed:[]};fillQuestion()}

function filteredWordList(){let arr=words;if(state.listFilter==='starter')arr=selectedDeck('starter');else if(state.listFilter==='basic')arr=selectedDeck('basic');else if(state.listFilter==='freq')arr=selectedDeck('freq');else if(state.listFilter==='wrong')arr=words.filter(isWrong);else if(state.listFilter==='starred')arr=words.filter(w=>p(w.id).star);const s=state.listSearch.trim().toLowerCase();if(s)arr=arr.filter(w=>w.en.toLowerCase().includes(s)||w.zh.includes(s)||w.ipa.toLowerCase().includes(s));return arr}
function wordResults(){const arr=filteredWordList();const n=Math.ceil(arr.length/state.listSize);state.listPage=Math.max(0,Math.min(state.listPage,Math.max(0,n-1)));const slice=arr.slice(state.listPage*state.listSize,(state.listPage+1)*state.listSize);return `<div class="word-table">${slice.map(w=>`<div class="word-row"><div><div class="en">${esc(w.en)} ${p(w.id).right?'✓':''}</div><div class="ipa">${esc(w.ipa)} · ${w.deck==='basic'?'基础':'高频'} #${w.no}</div></div><div class="zh">${esc(w.zh)}</div><div class="actions"><button class="icon-btn" aria-label="播放 ${esc(w.en)}" title="播放英语发音" data-action="speak" data-id="${w.id}">🔊</button><button class="icon-btn ${p(w.id).star?'saved':''}" aria-label="收藏 ${esc(w.en)}" title="收藏单词" data-action="star" data-id="${w.id}">${p(w.id).star?'★':'☆'}</button></div></div>`).join('')||'<div class="empty-state"><div class="empty-icon">🔎</div><h3>没找到单词</h3><p>试试换一个关键词或筛选条件。</p></div>'}</div><div class="pagination"><button class="btn outline small" data-action="page" data-dir="-1" ${state.listPage===0?'disabled':''}>上一页</button><span>第 ${n?state.listPage+1:0} / ${n} 页，共 ${arr.length} 词</span><button class="btn outline small" data-action="page" data-dir="1" ${state.listPage>=n-1?'disabled':''}>下一页</button></div>`}
function library(){const s=statTotal();return `<div class="h-over"><div><div class="eyebrow">YOUR VOCABULARY LIBRARY</div><h2 class="page-title">所有单词 📚</h2><p class="sub">PDF 第一章 1299 个词条、第二章 688 个高频词条，含原音标和中文释义；两种考试路线共用词库。</p></div></div><div class="panel"><div class="settings-row" style="margin-bottom:14px"><input class="search-field" id="word-search" placeholder="🔎 搜索英文 / 中文 / 音标" value="${esc(state.listSearch)}" aria-label="搜索单词"><button class="btn small ghost" data-action="clear-search">清空</button></div><div class="tabbar">${[['all','全部'],['starter','零基础'],['basic','基础1299'],['freq','高频688'],['wrong',`错词 ${s.wrong}`],['starred','★ 收藏']].map(([v,n])=>`<button class="tab ${state.listFilter===v?'active':''}" data-action="list-filter" data-filter="${v}">${n}</button>`).join('')}</div><div class="divider"></div><div id="word-results">${wordResults()}</div></div>`}
function mistakes(){const wrong=words.filter(isWrong),stars=words.filter(w=>p(w.id).star),arr=state.tab==='wrong'?wrong:stars;return `<div class="h-over"><div><div class="eyebrow">REVIEW & REMEMBER</div><h2 class="page-title">温柔地复习 💛</h2><p class="sub">遗忘不是失败，多遇见几次就会慢慢记住</p></div></div><div class="panel"><div class="tabbar"><button class="tab ${state.tab==='wrong'?'active':''}" data-action="mistake-tab" data-tab="wrong">🧩 需要再学 ${wrong.length}</button><button class="tab ${state.tab==='starred'?'active':''}" data-action="mistake-tab" data-tab="starred">⭐ 我的收藏 ${stars.length}</button></div>${arr.length?`<p class="sub" style="margin:19px 0 15px">有 ${arr.length} 个需要关注的单词，点喇叭可以重新听发音。</p><div class="task-list">${arr.slice(0,60).map(w=>`<div class="task"><div class="num">${w.deck==='basic'?'基':'高'}</div><div style="min-width:0;flex:1"><strong>${esc(w.en)}</strong><small>${esc(w.zh)}</small></div><button class="icon-btn" data-action="speak" data-id="${w.id}" title="听发音">🔊</button><button class="icon-btn ${p(w.id).star?'saved':''}" data-action="star" data-id="${w.id}" title="收藏">${p(w.id).star?'★':'☆'}</button></div>`).join('')}</div>${arr.length>60?'<p class="sub">先展示前 60 个，可在“全部单词”中查看全部。</p>':''}<div style="margin-top:20px"><button class="btn primary" data-action="quick-deck" data-deck="${state.tab==='wrong'?'wrong':'starred'}">重新学习这些词</button></div>`:`<div class="empty-state"><div class="empty-icon">🌻</div><h3>${state.tab==='wrong'?'暂时没有错词':'收藏夹还是空的'}</h3><p>${state.tab==='wrong'?'去闯关做题，没记住的词会来到这里。':'在词库里点 ☆ 就能把想复习的词收藏起来。'}</p><button class="btn primary" data-action="nav" data-view="${state.tab==='wrong'?'quiz':'library'}">${state.tab==='wrong'?'去练习':'打开词库'}</button></div>`}</div><div class="panel section-gap"><div class="panel-title"><h3>💾 保存学习记录</h3></div><p class="sub">网站不用登录，学习记录保存在<strong>当前浏览器的当前设备</strong>，不支持自动跨设备同步。换手机、清理数据前，建议先导出备份。</p><div class="backup-controls"><button class="btn outline" data-action="export">⬇ 导出学习记录</button><button class="btn outline" data-action="import">⬆ 导入学习记录</button><input id="import-file" type="file" accept="application/json,.json" aria-label="选择学习记录备份文件"></div><div class="divider"></div><div class="panel-title"><h3>⚙️ 每日学习目标</h3></div><div class="settings-row small-space"><label class="muted-label" for="goal-setting">每轮学习多少词？（主页计划会给出每日建议）</label><select class="pick goal-select" id="goal-setting">${[10,15,20,25,30,40,50].map(n=>`<option value="${n}" ${options.goal===n?'selected':''}>${n} 个 / 天</option>`).join('')}</select></div></div>`}
function render(){const html=state.view==='home'?home():state.view==='learn'?learn():state.view==='quiz'?quiz():state.view==='mistakes'?mistakes():library();$('app').innerHTML=shell(html);window.ciyaEnhance?.convertIcons?.()}
function exportProgress(){const payload={app:'词芽',version:3,date:new Date().toISOString(),records:rec,history,options};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='词芽学习记录-'+dateKey()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份文件已生成，请妥善保存')}
function importProgress(file){if(!file)return;if(file.size>3000000){toast('备份文件太大，请检查是否选错文件');return}const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(o.app!=='词芽'||!o.records||typeof o.records!=='object'||Array.isArray(o.records))throw Error('file');for(const [id,r] of Object.entries(o.records)){if(!byId.has(id)||!r||typeof r!=='object')continue;rec[id]={seen:Math.max(0,Number(r.seen)||0),right:Math.max(0,Number(r.right)||0),wrong:Math.max(0,Number(r.wrong)||0),streak:Math.max(0,Number(r.streak)||0),due:Number(r.due)||0,last:Number(r.last)||0,firstSeen:Number(r.firstSeen)||0,star:!!r.star}}if(o.history&&typeof o.history==='object'){for(const [date,ids] of Object.entries(o.history)){if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&Array.isArray(ids))history[date]=[...new Set([...(history[date]||[]),...ids.filter(id=>byId.has(id))])].slice(0,2000)}}save(STORE,rec);save(HISTORY,history);state.study=null;state.quiz=null;render();toast('学习记录导入成功')}catch{toast('这不是有效的词芽学习记录备份')}};fr.readAsText(file)}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='exam'){if(!examNames[el.dataset.exam])return;options.exam=el.dataset.exam;options.deck=recommendDeck();cfg();state.study=null;state.quiz=null;render();toast('已切换到'+examNames[options.exam]+'路线，进度会保留');return}if(action==='exam-study'){options.deck=recommendDeck();cfg();state.study=null;goto('learn');return}if(action==='nav'){goto(el.dataset.view);return}if(action==='speak'||action==='speak-slow'){speak(el.dataset.id,action==='speak-slow');return}if(action==='flip'){state.flip=true;render();const w=byId.get(state.study?.ids[state.study.index]);if(w)speak(w.id,true);return}if(action==='rate'){const word=byId.get(state.study?.ids[state.study.index]);if(!word)return;const ok=el.dataset.result==='right';recordResult(word,ok);state.study.index++;if(ok)state.study.correct++;else state.study.wrong++;state.flip=false;render();return}if(action==='restart-study'){startNext();render();return}if(action==='quick-deck'){options.deck=el.dataset.deck;cfg();startNext();goto('learn');return}if(action==='quiz-mode'){state.quizMode=el.dataset.mode;state.quiz=null;render();return}if(action==='start-quiz'){const de=$('quiz-deck');const len=$('quiz-length');if(de)options.deck=de.value;if(len)state.quizCount=Number(len.value);cfg();startQuiz();render();return}if(action==='choice'){const q=state.quiz;if(!q||q.answered)return;const w=byId.get(q.ids[q.index]);if(!w)return;q.chosen=el.dataset.id;q.answered=true;recordResult(w,q.chosen===w.id);if(q.chosen===w.id)q.correct++;else q.missed.push(w.id);render();return}if(action==='next-question'){const q=state.quiz;if(!q||!q.answered)return;q.index++;if(q.index<q.ids.length)fillQuestion();render();return}if(action==='list-filter'){state.listFilter=el.dataset.filter;state.listPage=0;render();return}if(action==='clear-search'){state.listSearch='';state.listPage=0;render();$('word-search')?.focus();return}if(action==='page'){state.listPage+=Number(el.dataset.dir);const box=$('word-results');if(box)box.innerHTML=wordResults();$('word-search')?.scrollIntoView({block:'start',behavior:'smooth'});return}if(action==='star'){const id=el.dataset.id;if(!byId.has(id))return;rec[id]={...p(id),star:!p(id).star};save(STORE,rec);render();toast(p(id).star?'⭐ 已收藏':'已取消收藏');return}if(action==='mistake-tab'){state.tab=el.dataset.tab;render();return}if(action==='export'){exportProgress();return}if(action==='import'){$('import-file')?.click();return}});
document.addEventListener('input',e=>{if(e.target.id==='word-search'){state.listSearch=e.target.value;state.listPage=0;const box=$('word-results');if(box)box.innerHTML=wordResults()}if(e.target.id==='spell-answer'&&state.quiz)state.quiz.typed=e.target.value});

</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script><script>/* 词芽 · 春考/夏考双考冲刺计划与双向翻译作答。保留原站点全部学习记录。 */
(() => {
  'use strict';
  const api = window.wordBud;
  if (!api || !Array.isArray(api.words)) return;
  const SPRING='2027-01-07', SUMMER='2027-06-07';
  const targetDays=d=>{
    const now=new Date(), today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
    const [y,m,day]=d.split('-').map(Number);
    return Math.max(0,Math.ceil((Date.UTC(y,m-1,day)-today)/86400000));
  };
  const dayNumber=()=>{const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());};
  const dateUtc=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
  const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const baseTarget=()=>{
    const n=dayNumber();
    if(n<dateUtc('2026-11-23'))return {stage:'启动期（前 3 天）',n:15,rev:20,questions:8,note:'先熟悉发音和最常见的词，不求一次全记住。'};
    if(n<dateUtc('2026-11-27'))return {stage:'加速适应期',n:20,rev:30,questions:10,note:'慢慢适应较高词量，复习昨天和前天的词。'};
    if(n<dateUtc('2026-12-26'))return {stage:'春考主攻期',n:30,rev:50,questions:15,note:'新词分成 3 组学习，每组 10 个。'};
    if(n<dateUtc('2027-01-07'))return {stage:'春考巩固期',n:10,rev:70,questions:20,note:'以错词、熟词辨认、翻译和阅读中常见词为主。'};
    if(n<=dateUtc('2027-01-07'))return {stage:'春考当天',n:0,rev:0,questions:0,note:'不安排临时突击，按考试要求赴考。'};
    if(n<dateUtc('2027-03-01'))return {stage:'夏考基础强化期',n:25,rev:50,questions:12,note:'继续补基础词，并加入高频词和简单句。'};
    if(n<dateUtc('2027-05-16'))return {stage:'夏考提升期',n:30,rev:60,questions:20,note:'词汇和英汉互译结合，也要练阅读理解与写作。'};
    if(n<dateUtc('2027-06-07'))return {stage:'夏考最后复习',n:10,rev:80,questions:20,note:'巩固错词与常用短语，保证睡眠和正常复习节奏。'};
    return {stage:'考试结束',n:10,rev:20,questions:10,note:'可以继续保持英语学习习惯。'};
  };
  const SETTINGS='ciya_sprint_settings_v1';
  let settings={intensity:'standard',...(() => {try{return JSON.parse(localStorage.getItem(SETTINGS))||{}}catch{return {}}})()};
  const plan=()=>{
    const base=baseTarget();const mult={light:.7,standard:1,sprint:1.25}[settings.intensity]||1;
    return {...base,n:base.n?Math.max(5,Math.round(base.n*mult/5)*5):0,rev:Math.round(base.rev*mult/5)*5,questions:Math.round(base.questions*mult/2)*2};
  };
  const todayNewCount=()=>{
    const today=api.dateKey(), ids=api.history[today]||[];
    return ids.filter(id=>{
      const r=api.rec[id]||{};
      if(r.firstSeen)return api.localDate(r.firstSeen)===today;
      return !Object.entries(api.history).some(([key,v])=>key<today&&Array.isArray(v)&&v.includes(id));
    }).length;
  };
  const reviewCount=()=>Math.max(0,(api.history[api.dateKey()]||[]).length-todayNewCount());
  function planPanel(){
    const p=plan(), n=todayNewCount(), reviewed=reviewCount(), newPct=p.n?Math.min(100,Math.round(n/p.n*100)):100;
    return `<section class="panel sprint-panel" id="sprint-panel"><div class="sprint-title"><div><div class="eyebrow">EXAM COUNTDOWN · 双考备考计划</div><h3>你的英语冲刺日历</h3></div><span class="sprint-stage">${esc(p.stage)}</span></div><div class="countdown-grid"><div class="countdown"><small>春季高考 · 2027/01/07</small><strong>${targetDays(SPRING)}<em>天</em></strong></div><div class="countdown violet"><small>夏季高考 · 2027/06/07</small><strong>${targetDays(SUMMER)}<em>天</em></strong></div></div><div class="sprint-today"><div class="sprint-goal"><small>今日新词</small><strong>${p.n}<em>个</em></strong></div><div class="sprint-goal"><small>建议复习</small><strong>${p.rev}<em>次</em></strong></div><div class="sprint-goal"><small>翻译练习</small><strong>${p.questions}<em>题</em></strong></div></div><p class="sprint-note">${esc(p.note)} 这是建议量，先保证能复习巩固，不必熬夜赶数量。</p><div class="sprint-progress-title"><span>今天首次接触新词</span><strong>${n} / ${p.n}</strong></div><div class="progress-track"><div class="progress-bar" style="width:${newPct}%"></div></div><div class="sprint-sub">已复习 ${reviewed} 个不同词 · 浏览器本地保存学习进度</div><div class="sprint-bottom"><label for="sprint-intensity">学习强度</label><select id="sprint-intensity" class="pick"><option value="light" ${settings.intensity==='light'?'selected':''}>轻量（约 70%）</option><option value="standard" ${settings.intensity==='standard'?'selected':''}>建议计划</option><option value="sprint" ${settings.intensity==='sprint'?'selected':''}>加强（约 125%）</option></select><button class="btn primary small" data-sprint="study">开始今日新词</button><button class="btn outline small" data-sprint="translate">去翻译作答</button></div><div class="sprint-route">前 3 天 15 词/天 → 第 4–7 天 20 词/天 → 春考主攻期约 30 词/天 → 考前巩固 → 夏考继续提升</div></section>`;
  }
  function updateGoal(force=false){
    const target=plan().n;
    if(target&&(force||api.options.goal===8||api.options.goal===15||api.options.goal<5)){
      api.options.goal=target;
      api.saveSettings();
    }
  }
  // 多义词中译英严格比对拼写；英译中接受词表里列出的不同中文义项。
  const cleanEn=s=>s.toLowerCase().trim().replace(/[\u2018\u2019]/g,"'").replace(/[\s\-]+/g,' ').replace(/[,.!?。！？，]+$/,'').trim();
  const zhAliases=zh=>{
    let s=String(zh)
      .replace(/\b(?:n|v|vt|vi|adj|adv|prep|pron|det|conj|int|abbr|num|a|ad)\.(?:&[a-z]+\.)?/gi,'')
      .replace(/\[[^\]]*\]/g,'')
      .replace(/（[^）]*）|\([^)]*\)/g,'')
      .replace(/(?:^|[；;])\s*(?:[UC]|sing|pl)\.\s*/gi,'');
    return [...new Set(s.split(/[；;、，,\/]/).map(x=>x.replace(/[\s.。:：、！!]/g,'').trim()).filter(x=>x&&x.length<=30))];
  };
  const cleanZh=s=>s.replace(/[\s.。:：、！!]/g,'').trim();
  function answerOK(input,w,mode){
    if(mode==='zh-en')return cleanEn(input)===cleanEn(w.en);
    const typed=cleanZh(input);
    if(!typed)return false;
    return zhAliases(w.zh).some(a=>typed===a);
  }
  const T={mode:'en-zh',session:null};
  function takeQuestions(){
    const target=Math.max(5,Math.min(30,plan().questions||10));
    const known=api.selectedDeck().filter(w=>api.rec[w.id]&&api.rec[w.id].seen);
    const pool=known.length>=4?known:api.selectedDeck('starter');
    const shuffled=[...pool].sort(()=>Math.random()-.5);
    T.session={ids:shuffled.slice(0,Math.min(target,shuffled.length)).map(w=>w.id),i:0,correct:0,answered:false,typed:'',missed:[],lastOK:false};
  }
  function translationPage(){
    if(!T.session)takeQuestions();
    const q=T.session,w=api.byId.get(q.ids[q.i]);
    const buttons=`<div class="translate-modes"><button class="tab ${T.mode==='en-zh'?'active':''}" data-translate="mode" data-mode="en-zh">英译中 · 写中文</button><button class="tab ${T.mode==='zh-en'?'active':''}" data-translate="mode" data-mode="zh-en">中译英 · 写英语</button></div>`;
    const head=`<div class="h-over"><div><div class="eyebrow">TRANSLATE & ANSWER</div><h2 class="page-title">翻译作答</h2><p class="sub">自己输入答案，提交后对照词表批改，错词会记入复习记录。</p></div></div>${buttons}`;
    if(!w)return `${head}<section class="panel translate-card translate-done"><div class="translate-award">${icon('check-circle')}</div><h3>这一轮完成</h3><p>答对 ${q.correct} / ${q.ids.length} 题。不会的词已记录，可以重新学习。</p><button class="btn primary" data-translate="restart">继续练习</button><button class="btn outline" data-translate="review">打开错词复习</button></section>`;
    return `${head}<section class="panel translate-card"><div class="translate-meta"><span>第 ${q.i+1} / ${q.ids.length} 题</span><span>已答对 ${q.correct} 题</span></div><div class="progress-track"><div class="progress-bar" style="width:${Math.round((q.i+(q.answered?1:0))/q.ids.length*100)}%"></div></div><div class="translate-tag">${T.mode==='en-zh'?'看英文，写出中文意思':'看中文，写出对应英文'}</div><div class="translate-question">${T.mode==='en-zh'?esc(w.en):esc(w.zh)}</div><div class="translate-assist">${T.mode==='en-zh'?esc(w.ipa):'不会拼写时可以先尝试，系统会显示正确答案'}</div>${T.mode==='en-zh'?`<button class="btn ghost small" data-translate="speak">${icon('volume-2')} 听单词发音</button>`:''}<form id="translate-form"><label class="translate-label" for="translate-input">你的${T.mode==='en-zh'?'中文':'英文'}答案</label><input id="translate-input" class="translate-input" ${q.answered?'disabled':''} autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${T.mode==='en-zh'?'例如：帮助':'例如：help'}" value="${esc(q.typed)}"><button class="btn primary full big" type="submit" ${q.answered?'disabled':''}>提交并批改</button></form>${q.answered?`<div class="feedback ${q.lastOK?'good':'bad'}"><strong>${q.lastOK?'回答正确':'再记一下这个词'}</strong><div>${esc(w.en)} <small>${esc(w.ipa)}</small> — ${esc(w.zh)}</div>${!q.lastOK?'<small>不同义项或错别字可能被判错，请对照原词表理解。</small>':''}</div><button class="btn primary full big" data-translate="next">${q.i+1===q.ids.length?'查看本轮成绩':'下一题'}</button>`:`<button class="btn outline full" data-translate="unknown">不会，查看答案并加入复习</button>`}</section><div class="tip-box small-space">建议第一遍先练「英译中」，熟练后再练「中译英」；背词和翻译作答会共用错题记录。</div>`;
  }
  function grade(value,pass=false){
    const q=T.session;if(!q||q.answered)return;
    const w=api.byId.get(q.ids[q.i]);if(!w)return;
    const ok=!pass&&answerOK(value,w,T.mode);
    q.typed=value;q.answered=true;q.lastOK=ok;
    if(ok)q.correct++;else q.missed.push(w.id);
    api.recordResult(w,ok);api.render();
  }
  const outlines={

    book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',

  function icon(name){return `<svg class="ciya-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${outlines[name]||outlines.spark}</svg>`;}
  const emojiIcons={ '🔊':'volume-2','🐢':'volume-1','📖':'book','📚':'book','📗':'book','📈':'chart','🔔':'calendar','📌':'calendar','🧩':'quiz','🧠':'quiz','🔎':'search','🎯':'medal','🏆':'award','⭐':'star','🌟':'star','✨':'spark','🌼':'seed','🌱':'seed','🌷':'seed','🌻':'seed','💛':'heart','♡':'heart','🔥':'flame','🟢':'check-circle','🎧':'volume-2','⚡':'spark','🔤':'pen','💡':'light','💾':'backup','⚙️':'pencil','✅':'check-circle','❌':'refresh','💪':'medal','🎉':'award','▶':'check','⬇':'backup','⬆':'backup','✿':'leaf'};
  // Replace decorative emoji glyphs with crisp monochrome line icons, without changing original text meaning.
  function convertIcons(){
    const app=document.getElementById('app');if(!app)return;
    const walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);
    const changes=[];while(walker.nextNode()){
      const node=walker.currentNode;
      if(!node.nodeValue||!/[\u2600-\u27bf\u{1f300}-\u{1faff}]/u.test(node.nodeValue))continue;
      if(node.parentElement?.closest('input,textarea,script,style'))continue;
      changes.push(node);
    }
    for(const node of changes){
      const text=node.nodeValue;
      const regexp=/([\u{1F300}-\u{1FAFF}\u2600-\u27BF]\uFE0F?)/gu;
      const parts=text.split(regexp);
      if(parts.length<=1)continue;
      const fragment=document.createDocumentFragment();
      for(const part of parts){if(!part)continue;
        if(part in emojiIcons){const span=document.createElement('span');span.className='ciya-inline-icon';span.innerHTML=icon(emojiIcons[part]);fragment.appendChild(span);}
        else if(/[\u2600-\u27bf\u{1f300}-\u{1faff}]/u.test(part)){const span=document.createElement('span');span.className='ciya-inline-icon';span.innerHTML=icon('spark');fragment.appendChild(span)}else fragment.appendChild(document.createTextNode(part));
      }
      node.replaceWith(fragment);
    }
  }
  document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-translate],[data-sprint]');if(!btn)return;
    if(btn.dataset.sprint==='translate'){api.getState().quizMode='translate';T.session=null;api.goto('quiz');return;}
    if(btn.dataset.sprint==='study'){api.options.deck='starter';if(api.words.filter(w=>w.deck==='basic'&&api.rec[w.id]?.seen).length>=40)api.options.deck='basic';api.saveSettings();api.getState().study=null;api.goto('learn');return;}
    const action=btn.dataset.translate;if(!action)return;
    if(action==='mode'){T.mode=btn.dataset.mode;T.session=null;api.render();return;}
    if(action==='speak'){const w=api.byId.get(T.session?.ids[T.session?.i]);if(w)api.speak(w.id);return;}
    if(action==='unknown'){grade('',true);return;}
    if(action==='next'){if(!T.session?.answered)return;T.session.i++;T.session.answered=false;T.session.typed='';api.render();return;}
    if(action==='restart'){takeQuestions();api.render();return;}
    if(action==='review'){api.goto('mistakes');return;}
  });
  document.addEventListener('submit',e=>{if(e.target.id!=='translate-form')return;e.preventDefault();const input=document.getElementById('translate-input');if(!input||!input.value.trim()){alert('先输入你的答案，或者点击“不会”查看答案');return;}grade(input.value.trim());});
  document.addEventListener('change',e=>{if(e.target.id!=='sprint-intensity')return;settings.intensity=e.target.value;try{localStorage.setItem(SETTINGS,JSON.stringify(settings))}catch{}updateGoal(true);api.getState().study=null;api.render();});
  window.ciyaEnhance={planPanel,translationPage,icon,answerOK,plan,todayNewCount,convertIcons};
  updateGoal();
  const root=document.getElementById('app');if(root)convertIcons();
  api.render();
})();
